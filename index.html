*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:block;background:var(--brand);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:420/477}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* ribbon */
.ribbon{background:var(--fg);color:var(--bg);overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;padding:7px 0}
.ribbon .tr{display:inline-block;animation:mq 30s linear infinite;will-change:transform}
.ribbon span{padding:0 28px}
@keyframes mq{to{transform:translateX(50%)}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:2px solid var(--fg);height:var(--hh)}
.top .wrap{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}

.ib{background:none;border:0;padding:8px;display:inline-flex;position:relative;align-items:center}
.top .acts{display:flex;justify-content:flex-end;gap:2px}
.badge{position:absolute;top:0;inset-inline-end:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sbar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px}
.sbar input{width:100%;padding:12px 14px;border:2px solid var(--fg);background:var(--bg);border-radius:0}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--brand-deep);color:#fff;aspect-ratio:4/5;max-height:640px;width:100%;touch-action:pan-y}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;background:linear-gradient(155deg,var(--brand) 0%,var(--brand-deep) 70%)}

.slide>img,.slide>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,4,10,.72),rgba(20,4,10,0) 62%)}
.slide .mark{position:absolute;inset-inline-start:-12%;top:6%;width:78%;background:rgba(255,255,255,.1);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:420/477}
.slide .tx{position:absolute;z-index:2;inset-inline:0;bottom:0;padding:0 max(16px,env(safe-area-inset-left,0px)) 48px;max-width:1200px;margin-inline:auto}
.slide h2{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,10vw,72px);line-height:1.08;margin:0 0 8px;text-wrap:balance;max-width:14ch}
.slide p{margin:0 0 18px;font-size:16px;max-width:34ch;opacity:.92}
.cta{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#171214;font-weight:700;border:0;padding:14px 22px;text-decoration:none;border-bottom:4px solid #171214;font-size:15px}
.dots{position:absolute;z-index:3;inset-inline:0;bottom:18px;display:flex;gap:6px;justify-content:center}
.dots button{width:30px;height:4px;border:0;background:rgba(255,255,255,.4);padding:0}
.dots button.on{background:#fff}

/* sections */
.sec{padding-block:36px 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;min-height:112px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;border:0;text-align:start;background:var(--fg);color:var(--bg)}
.tile:nth-child(2){background:var(--brand);color:var(--on-brand)}
.tile:nth-child(3){background:var(--surface);color:var(--fg)}
.tile:nth-child(4){background:var(--fg);color:var(--bg)}
.tile b{font-family:var(--f-display);font-size:24px;line-height:1.15;font-weight:700}
.tile.wide{grid-column:1/-1;background:var(--brand);color:var(--on-brand);min-height:96px;flex-direction:row;align-items:center}
.tile .ar{align-self:flex-start}
.tile.wide .ar{align-self:center}
@media(min-width:760px){.tiles{grid-template-columns:repeat(5,1fr)}.tile.wide{grid-column:auto;flex-direction:column;align-items:stretch}}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}

.pills{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:40;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:16px}
.pills .in{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.pills .in::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--fg);background:var(--bg);padding:7px 16px;font-weight:600;font-size:14px;border-radius:0}
.pill.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.empty{padding:40px 0;color:var(--muted);text-align:center;grid-column:1/-1}

/* card */
.card{display:flex;flex-direction:column;min-width:0}
.pic{position:relative;aspect-ratio:4/5;background:var(--surface);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,var(--surface),var(--line))}
.ph i{display:block;width:62%;background:var(--brand);opacity:.16;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:420/477}
.ph span{position:absolute;bottom:10px;inset-inline-start:10px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.tag{position:absolute;top:0;inset-inline-start:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;padding:4px 10px}
.edit{position:absolute;top:8px;inset-inline-end:8px;background:var(--fg);color:var(--bg);border:0;padding:7px;display:inline-flex}
.info{padding-top:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.code{font-size:12px;color:var(--muted);letter-spacing:.04em}
.price{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price s{color:var(--muted);font-weight:400;font-size:13px}
.price em{font-style:normal;color:var(--brand)}
.sz{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.sz button{min-width:36px;padding:5px 8px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;border-radius:0}
.sz button.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.btns{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 10px;font-weight:700;font-size:14px;text-decoration:none;border:2px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:0;text-align:center}
.btn.wa{border-color:var(--wa);color:var(--wa)}
.btn.add{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;font-size:13px;padding:4px 12px}
.btn:disabled{opacity:.5}

.foot{margin-top:48px;background:var(--fg);color:var(--bg);padding-block:32px 40px}
.foot .logo{height:72px;background:var(--bg)}
.foot .gen{margin-top:26px;padding-top:14px;border-top:1px solid rgba(128,128,128,.4);font-size:12px;opacity:.7;text-align:center;letter-spacing:.03em;direction:ltr}
.foot p{opacity:.75;margin:12px 0 18px;font-size:14px}
.foot .row{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{border-color:var(--bg);background:transparent;color:var(--bg)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,4,6,.55);z-index:80;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--bg);z-index:90;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-inline-start:2px solid var(--fg)}
.drawer.on{display:flex}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:2px solid var(--fg)}
.dh h2{margin:0;font-family:var(--f-display);font-size:24px}
.db{flex:1;overflow:auto;padding:8px 16px}
.df{padding:14px 16px;border-top:2px solid var(--fg);display:flex;flex-direction:column;gap:10px}
.ci{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .pic{aspect-ratio:1}
.ci h4{margin:0;font-size:14px}
.ci .m{font-size:12px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--fg);margin-top:6px}
.qty button{width:34px;height:32px;border:0;background:none;font-size:18px}
.qty b{min-width:30px;text-align:center}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.toast{position:fixed;z-index:120;top:calc(env(safe-area-inset-top,0px) + 8px);inset-inline:max(12px,env(safe-area-inset-left,0px));margin-inline:auto;max-width:520px;background:var(--fg);color:var(--bg);padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:12px;border-inline-start:6px solid var(--brand);font-weight:600}
.toast.on{display:flex}
.toast button{background:var(--bg);color:var(--fg);border:0;padding:8px 14px;font-weight:700;white-space:nowrap}

/* intro */
.intro{position:fixed;inset:0;z-index:200;background:var(--brand-deep);display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.intro.on{display:flex}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro .big{position:absolute;width:150vmax;aspect-ratio:1;border:2px solid rgba(255,255,255,.12);transform:rotate(45deg) scale(.2);animation:ring 3s ease-out forwards}
.intro .big.b{animation-delay:.35s}
@keyframes ring{to{transform:rotate(45deg) scale(1);opacity:0}}
.intro .lg{width:min(58vw,260px);background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:420/477;clip-path:inset(0 0 100% 0);animation:wipe 1.4s .5s cubic-bezier(.7,0,.2,1) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.intro .tg{color:#fff;font-family:var(--f-display);letter-spacing:.14em;margin-top:22px;opacity:0;animation:fade .8s 1.7s forwards;font-size:16px}
@keyframes fade{to{opacity:1}}
.intro .cr{position:absolute;z-index:2;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);text-align:center;color:#fff;font-weight:700;font-size:17px;opacity:0;animation:fade .8s 2.2s forwards}
.intro .cr small{display:block;font-weight:500;font-size:12px;opacity:.7;margin-bottom:2px;letter-spacing:.04em}
.intro .skip{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-start:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;padding:8px 16px;font-weight:600}
@media(prefers-reduced-motion:reduce){.ribbon .tr,.intro .big{animation:none}.intro .cr{animation:none;opacity:1}.intro .lg{animation:none;clip-path:none}.intro .tg{animation:none;opacity:1}.slide{transition:none}html{scroll-behavior:auto}}

/* picker */
.pkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pkg button{border:2px solid var(--line);background:var(--bg);padding:0;text-align:start;display:flex;flex-direction:column;min-width:0}
.pkg button:hover,.pkg button:focus-visible{border-color:var(--brand)}
.pkg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface)}
.pkg span{font-size:11px;padding:4px 6px;direction:ltr;overflow-wrap:anywhere;line-height:1.3}
.pkg .vf{aspect-ratio:1;display:grid;place-items:center;background:var(--surface);font-weight:700;color:var(--brand)}
/* admin */
.adbar{background:var(--brand);color:var(--on-brand);padding:8px 0;font-size:13px;font-weight:600}
.adbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px}
.adbar button{background:#fff;color:#171214;border:0;padding:6px 12px;font-weight:700}
.fab{position:fixed;z-index:55;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--brand);color:var(--on-brand);border:0;width:56px;height:56px;display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.fab.on{display:grid}
.sheet{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{display:flex}
.sheet .dh{background:var(--fg);color:var(--bg);border:0}
.sheet .dh .ib{color:var(--bg)}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--fg);scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;padding:12px 16px;font-weight:600;border-bottom:4px solid transparent}
.tabs button.on{border-bottom-color:var(--brand);color:var(--brand)}
.sb{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px))}
.pane{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li .pic{aspect-ratio:1}
.li b{display:block;font-size:14px;line-height:1.35}
.li small{color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{padding:11px 12px;border:2px solid var(--line);background:var(--bg);border-radius:0;font-weight:400;font-size:15px;min-width:0}

.box{border:2px solid var(--fg);padding:14px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-family:var(--f-display);font-size:19px}
.msg{padding:10px 12px;background:var(--surface);font-size:13px;border-inline-start:4px solid var(--brand);white-space:pre-wrap}

.modal.on{display:flex}
.mc{background:var(--bg);width:min(560px,100%);max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--brand);display:flex;flex-direction:column;gap:12px}
@media(min-width:620px){.modal{align-items:center}}
.mc h3{margin:0;font-family:var(--f-display);font-size:22px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.up{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.up .pic{aspect-ratio:1}
</style>

  <nav class="tabs" id="tabs"></nav>

<div class="modal" id="modal"><div class="mc" id="mc"></div></div>
<div class="modal" id="modal2" style="z-index:140"><div class="mc" id="mc2"></div></div>
</div>

<script>
(function(){
'use strict';
document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const ic={
  edit:'<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  wa:'<svg class="i f" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.4A10 10 0 1 0 12 2zm5.3 14c-.2.6-1.2 1.2-1.700 1.200-.5.1-1.100.2-3.400-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-1.900.9-2.200c.2-.2.5-.3.700-.3h.5c.2 0 .4 0 .6.5l.8 1.900c.1.200.1.400 0 .5l-.3.500-.4.400c-.1.100-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.8-1c.2-.3.400-.2.700-.1l1.800.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>',
  ar:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
};
const CATS=[{id:'women',name:'ملابس النساء'},{id:'kids',name:'ملابس الأطفال'},{id:'men',name:'ملابس الرجال'},{id:'home',name:'المفروشات'},{id:'offers',name:'أقوى العروض'}];
const catName=id=>(CATS.find(c=>c.id===id)||{name:'كل القطع'}).name;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const SAMPLE=[
 {id:'s1',name:'عباية كريب سوداء',code:'W-1001',price:850,oldPrice:1100,sizes:['S','M','L','XL'],cat:'women',offer:true,image:''},
 {id:'s2',name:'فستان سهرة بوردو',code:'W-1002',price:1250,oldPrice:0,sizes:['S','M','L'],cat:'women',offer:false,image:''},
 {id:'s3',name:'طقم أطفال قطن',code:'K-2001',price:320,oldPrice:420,sizes:['2','4','6','8'],cat:'kids',offer:true,image:''},
 {id:'s4',name:'جاكيت شتوي للأطفال',code:'K-2002',price:480,oldPrice:0,sizes:['4','6','8','10'],cat:'kids',offer:false,image:''},
 {id:'s5',name:'قميص رجالي كلاسيك',code:'M-3001',price:540,oldPrice:0,sizes:['M','L','XL','XXL'],cat:'men',offer:false,image:''},
 {id:'s6',name:'بنطلون جينز رجالي',code:'M-3002',price:690,oldPrice:850,sizes:['30','32','34','36'],cat:'men',offer:true,image:''},
 {id:'s7',name:'ملاية سرير قطن مزدوجة',code:'H-4001',price:780,oldPrice:0,sizes:[],cat:'home',offer:false,image:''},
 {id:'s8',name:'طقم مفارش سرير 6 قطع',code:'H-4002',price:1650,oldPrice:1990,sizes:[],cat:'home',offer:true,image:''}
];
const DEF=()=>({v:1,updatedAt:0,pw:'',
 settings:{wa:'',ribbon:'اطلب قطعتك الآن عبر واتساب  •  متجر رويا للملابس والمفروشات  •  اكتشف أقوى العروض',introVideo:'',cur:'ج.م'},
 ads:[
  {id:'a1',title:'تشكيلة جديدة من رويا',sub:'أزياء نسائية بتفاصيل تفرق',cta:'تسوّق النساء',cat:'women',image:'',video:''},
  {id:'a2',title:'أقوى العروض',sub:'قطع مختارة بأسعار أقل',cta:'شاهد العروض',cat:'offers',image:'',video:''},
  {id:'a3',title:'مفروشات رويا',sub:'لمسة دفء لكل غرفة في بيتك',cta:'تسوّق المفروشات',cat:'home',image:'',video:''}
 ],
 products:SAMPLE.map(p=>({...p}))
});

let D=null,S={filter:'all',q:'',admin:false,tab:'products',slide:0,sel:{}};
let cart=store.get('roya_cart',[]);
const cache={};
const src=p=>cache[p]||p;

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('roya:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'roya:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,''));return isNaN(n)?0:n};
const money=n=>Number(n||0).toLocaleString('en-US')+' '+D.settings.cur;
const isOffer=p=>p.offer||(p.oldPrice&&p.oldPrice>p.price);
const pct=p=>p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;

function toast(msg,act){const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(act?'<button data-act="'+act.a+'">'+esc(act.t)+'</button>':'');t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),act?5000:2800)}
function persist(){D.updatedAt=Date.now();if(!store.set('roya_data',D))toast('المساحة ممتلئة. استخدم ربط GitHub لحفظ الصور.');store.set('roya_dirty',1)}
function saveCart(){store.set('roya_cart',cart)}

/* ---------- WhatsApp ---------- */
const waNum=()=>String(D.settings.wa||'').replace(/\D/g,'');
const waUrl=t=>'https://wa.me/'+waNum()+'?text='+encodeURIComponent(t);
function lineFor(p,size,qty,i){return (i?i+') ':'')+p.name+' | كود: '+(p.code||'-')+(size?' | مقاس: '+size:'')+(qty?' | الكمية: '+qty:'')+' | السعر: '+money(p.price)}
function cartText(){let t='مرحباً رويا، أرغب في طلب القطع التالية:\n';let tot=0;cart.forEach((c,i)=>{const p=D.products.find(x=>x.id===c.id);if(!p)return;tot+=p.price*c.qty;t+='\n'+lineFor(p,c.size,c.qty,i+1)});return t+'\n\nالإجمالي: '+money(tot)}

/* ---------- render ---------- */
function renderRibbon(){const r=esc(D.settings.ribbon||'');$('#ribbon').innerHTML=('<span>'+r+'</span>').repeat(8)}
function renderHero(){
  const h=$('#hero');const ads=D.ads;
  if(!ads.length){h.hidden=true;return}h.hidden=false;
  if(S.slide>=ads.length)S.slide=0;
  h.innerHTML=ads.map((a,i)=>{
    const media=a.video?'<video src="'+esc(src(a.video))+'" autoplay muted loop playsinline></video>':a.image?'<img src="'+esc(src(a.image))+'" alt="'+esc(a.title)+'">':'<span class="mark"></span>';
    return '<div class="slide'+(i===S.slide?' on':'')+'" data-i="'+i+'">'+media+'<div class="tx"><h2>'+esc(a.title)+'</h2><p>'+esc(a.sub)+'</p><a class="cta" href="#shop" data-act="cat" data-c="'+esc(a.cat||'all')+'">'+esc(a.cta||'تسوّق الآن')+' '+ic.ar+'</a>'+(S.admin?' <button class="cta" data-act="edit-ad" data-id="'+a.id+'" style="margin-inline-start:8px">تعديل الإعلان</button>':'')+'</div></div>';
  }).join('')+(ads.length>1?'<div class="dots">'+ads.map((a,i)=>'<button data-act="slide" data-i="'+i+'" class="'+(i===S.slide?'on':'')+'" aria-label="إعلان '+(i+1)+'"></button>').join('')+'</div>':'');
}
function goSlide(i){const n=D.ads.length;if(!n)return;S.slide=(i+n)%n;document.querySelectorAll('#hero .slide').forEach((s,k)=>s.classList.toggle('on',k===S.slide));document.querySelectorAll('#hero .dots button').forEach((s,k)=>s.classList.toggle('on',k===S.slide))}
function renderTiles(){
  const list=CATS.map(c=>c.id==='offers'?'<a class="tile wide" href="#shop" data-act="cat" data-c="offers"><b>'+c.name+'</b>'+ic.ar+'</a>':'<a class="tile" href="#shop" data-act="cat" data-c="'+c.id+'"><b>'+c.name+'</b>'+ic.ar+'</a>');
  $('#tiles').innerHTML=list.join('');
  $('#menuList').innerHTML='<a class="tile" style="margin-bottom:8px" href="#shop" data-act="cat" data-c="all"><b>كل القطع</b>'+ic.ar+'</a>'+CATS.map(c=>'<a class="tile" style="margin-bottom:8px" href="#shop" data-act="cat" data-c="'+c.id+'"><b>'+c.name+'</b>'+ic.ar+'</a>').join('');
}
function card(p){
  const off=pct(p);const hasSz=p.sizes&&p.sizes.length;const sel=S.sel[p.id]||'';
  const pic=p.image?'<img loading="lazy" src="'+esc(src(p.image))+'" alt="'+esc(p.name)+'" onerror="this.remove()">':'';
  return '<article class="card" data-id="'+p.id+'"><div class="pic"><div class="ph"><i></i><span>'+esc(p.code||'')+'</span></div>'+pic+(off?'<span class="tag">-'+off+'%</span>':(isOffer(p)?'<span class="tag">عرض</span>':''))+(S.admin?'<button class="edit" data-act="edit-p" data-id="'+p.id+'" aria-label="تعديل">'+ic.edit+'</button>':'')+'</div>'+
  '<div class="info"><h3>'+esc(p.name)+'</h3><div class="code">كود: '+esc(p.code||'-')+'</div><div class="price"><span>'+money(p.price)+'</span>'+(p.oldPrice>p.price?'<s>'+money(p.oldPrice)+'</s>':'')+'</div>'+
  (hasSz?'<div class="sz" role="group" aria-label="المقاس">'+p.sizes.map(s=>'<button data-act="size" data-id="'+p.id+'" data-s="'+esc(s)+'" class="'+(s===sel?'on':'')+'">'+esc(s)+'</button>').join('')+'</div>':'')+
  '<div class="btns"><a class="btn wa" data-act="wa" data-id="'+p.id+'" href="'+(waNum()?waUrl('مرحباً رويا، أرغب في طلب:\n'+lineFor(p,sel,0,0)):'#')+'" target="_blank" rel="noopener">'+ic.wa+' اطلب عبر واتساب</a><button class="btn add" data-act="add" data-id="'+p.id+'">أضف إلى السلة</button></div></div></article>';
}
function renderRail(){const l=D.products.filter(isOffer);$('#offers').hidden=!l.length;$('#rail').innerHTML=l.map(card).join('')}
function filtered(){
  let l=D.products;
  if(S.filter==='offers')l=l.filter(isOffer);else if(S.filter!=='all')l=l.filter(p=>p.cat===S.filter);
  const q=S.q.trim().toLowerCase();if(q)l=l.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q));
  return l;
}
function renderShop(){
  $('#pills').innerHTML=[{id:'all',name:'الكل'}].concat(CATS).map(c=>'<button class="pill'+(S.filter===c.id?' on':'')+'" data-act="cat" data-c="'+c.id+'">'+c.name+'</button>').join('');
  const l=filtered();$('#cnt').textContent=l.length+' قطعة';
  $('#t3').textContent=S.filter==='all'?'كل القطع':catName(S.filter);
  $('#grid').innerHTML=l.length?l.map(card).join(''):'<div class="empty">لا توجد قطع في هذا القسم حالياً.</div>';
}
function renderCartUI(){
  const n=cart.reduce((a,c)=>a+c.qty,0);const b=$('#cartN');b.hidden=!n;b.textContent=n;
  const L=$('#cartList'),F=$('#cartFoot');
  const rows=cart.map((c,i)=>{const p=D.products.find(x=>x.id===c.id);return p?{c,p,i}:null}).filter(Boolean);
  if(!rows.length){L.innerHTML='<div class="empty">السلة فارغة. أضف قطعاً من المتجر.</div>';F.innerHTML='<button class="btn dark" data-act="close-all">متابعة التسوق</button>';return}
  L.innerHTML=rows.map(({c,p,i})=>'<div class="ci"><div class="pic"><div class="ph"><i></i></div>'+(p.image?'<img src="'+esc(src(p.image))+'" alt="" onerror="this.remove()">':'')+'</div><div><h4>'+esc(p.name)+'</h4><div class="m">كود: '+esc(p.code||'-')+(c.size?' • مقاس: '+esc(c.size):'')+'</div><div class="price" style="font-size:14px">'+money(p.price*c.qty)+'</div><div class="row2" style="justify-content:space-between"><div class="qty"><button data-act="qty" data-i="'+i+'" data-d="-1" aria-label="أنقص">−</button><b>'+c.qty+'</b><button data-act="qty" data-i="'+i+'" data-d="1" aria-label="زِد">+</button></div><button class="btn sm danger" data-act="rm" data-i="'+i+'">حذف</button></div></div></div>').join('');
  const tot=rows.reduce((a,{c,p})=>a+p.price*c.qty,0);
  F.innerHTML='<div class="tot"><span>الإجمالي</span><span>'+money(tot)+'</span></div><a class="btn wa" id="cartWa" data-act="cart-wa" href="'+(waNum()?waUrl(cartText()):'#')+'" target="_blank" rel="noopener">'+ic.wa+' اطلب السلة عبر واتساب</a><button class="btn sm" data-act="clear-cart">تفريغ السلة</button>';
}
function renderAll(){renderRibbon();renderHero();renderTiles();renderRail();renderShop();renderCartUI();$('#adbar').hidden=!S.admin;$('#fab').classList.toggle('on',S.admin);$('#footWa').href=waNum()?'https://wa.me/'+waNum():'#'}

/* ---------- panels ---------- */
function closeAll(){['ov','menu','cart'].forEach(i=>$('#'+i).classList.remove('on'))}
function openDrawer(id){closeAll();$('#ov').classList.add('on');$('#'+id).classList.add('on')}
function openModal(html){$('#mc').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#mc').innerHTML=''}
function needWa(){if(!waNum()){toast('رقم واتساب غير مضبوط بعد. يضبطه المسؤول من إدارة رويا.');return true}return false}

/* ---------- clicks ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
   case 'open-menu':openDrawer('menu');break;
   case 'open-cart':openDrawer('cart');break;
   case 'close-all':closeAll();break;
   case 'home':e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});break;
   case 'toggle-search':{const b=$('#sbar');b.hidden=!b.hidden;if(!b.hidden)$('#q').focus();break}
   case 'cat':S.filter=el.dataset.c;closeAll();renderShop();if(el.tagName==='A'){e.preventDefault()}$('#shop').scrollIntoView({behavior:'smooth',block:'start'});break;
   case 'slide':goSlide(+el.dataset.i);break;
   case 'size':{S.sel[id]=S.sel[id]===el.dataset.s?'':el.dataset.s;document.querySelectorAll('.card[data-id="'+id+'"]').forEach(c=>{c.querySelectorAll('.sz button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.sel[id]));const p=D.products.find(x=>x.id===id);const w=c.querySelector('[data-act=wa]');if(w&&waNum())w.href=waUrl('مرحباً رويا، أرغب في طلب:\n'+lineFor(p,S.sel[id],0,0))});break}
   case 'wa':{const p=D.products.find(x=>x.id===id);if(needWa()){e.preventDefault();break}if(p.sizes&&p.sizes.length&&!S.sel[id]){e.preventDefault();toast('اختر المقاس أولاً')}break}
   case 'add':{const p=D.products.find(x=>x.id===id);if(p.sizes&&p.sizes.length&&!S.sel[id]){toast('اختر المقاس أولاً');break}
     const size=S.sel[id]||'';const f=cart.find(c=>c.id===id&&c.size===size);if(f)f.qty++;else cart.push({id,size,qty:1});saveCart();renderCartUI();toast('تمت إضافة القطعة إلى السلة',{a:'open-cart',t:'فتح السلة'});break}
   case 'qty':{const c=cart[+el.dataset.i];c.qty+=+el.dataset.d;if(c.qty<1)cart.splice(+el.dataset.i,1);saveCart();renderCartUI();break}
   case 'rm':cart.splice(+el.dataset.i,1);saveCart();renderCartUI();break;
   case 'clear-cart':cart=[];saveCart();renderCartUI();break;
   case 'cart-wa':if(needWa())e.preventDefault();break;
   case 'admin-login':adminLogin();break;
   case 'open-admin':openSheet();break;
   case 'close-sheet':$('#sheet').classList.remove('on');break;
   case 'logout':S.admin=false;sess.set('roya_admin','');$('#sheet').classList.remove('on');renderAll();toast('تم تسجيل الخروج');break;
   case 'add-p':editProduct(null);break;
   case 'edit-p':editProduct(id);break;
   case 'edit-ad':editAd(id);break;
  }
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderShop();if(S.q)$('#shop').scrollIntoView({behavior:'smooth',block:'start'})});
let tx=0;const hero=$('#hero');
hero.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
hero.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>45)goSlide(S.slide+(d<0?1:-1))});
setInterval(()=>{if(!S.admin&&!document.hidden&&D&&D.ads.length>1)goSlide(S.slide+1)},6000);

/* ---------- intro ---------- */
function runIntro(){
  if(sess.get('roya_intro'))return;sess.set('roya_intro','1');
  const o=$('#intro');const v=D.settings.introVideo;
  const end=()=>{o.classList.remove('on');o.innerHTML=''};
  o.classList.add('on');
  o.innerHTML=(v?'<video id="iv" src="'+esc(src(v))+'" autoplay muted playsinline></video>':'<span class="big"></span><span class="big b"></span><span class="lg"></span><div class="tg">ملابس • مفروشات • عروض</div>')+'<div class="cr"><small>تنفيذ</small>مهندس مدني. إبراهيم الجمل</div><button class="skip" id="skip">تخطي</button>';
  $('#skip').onclick=end;
  if(v){const vi=$('#iv');vi.onended=end;vi.onerror=end;setTimeout(end,20000)}else setTimeout(end,3600);
}

/* ---------- repo picker ---------- */
function pickRepo(kind){
  return new Promise(async res=>{
    const M=$('#modal2'),m=$('#mc2');const vid=kind==='video';
    const done=v=>{M.classList.remove('on');m.innerHTML='';res(v)};
    m.innerHTML='<h3>'+(vid?'اختيار فيديو':'اختيار صورة')+' من المستودع</h3><div id="pkl" class="msg">جاري تحميل الملفات...</div><label class="fld">أو اكتب اسم الملف كما هو في المستودع<input id="pkm" dir="ltr" placeholder="'+(vid?'intro.mp4':'shirt1.jpg')+'"></label><div class="row2"><button class="btn dark" id="pku" style="flex:1">استخدام الاسم</button><button class="btn" id="pkc">إلغاء</button></div>';
    M.classList.add('on');
    $('#pkc').onclick=()=>done(null);
    $('#pku').onclick=()=>{const v=$('#pkm').value.trim().replace(/^\/+/,'');if(v)done(v)};
    const L=$('#pkl');
    if(!ghReady()){L.textContent='اربط GitHub من تبويب GitHub لعرض ملفات المستودع هنا. أو اكتب اسم الملف في الخانة بالأسفل.';return}
    try{
      const r=await gh('GET','contents?ref='+encodeURIComponent(ghCfg().branch||'main'));
      if(r.status===404)throw new Error('المستودع أو الفرع غير موجود');
      const ext=vid?/\.(mp4|webm|mov|m4v|ogv)$/i:/\.(jpe?g|png|webp|gif|avif)$/i;
      const list=(await r.json()).filter(f=>f.type==='file'&&ext.test(f.name));
      if(!list.length){L.textContent=vid?'لا توجد فيديوهات في أول المستودع. ارفع الفيديو على GitHub ثم أعد المحاولة.':'لا توجد صور في أول المستودع. ارفع الصور على GitHub ثم أعد المحاولة.';return}
      L.className='pkg';
      L.innerHTML=list.map((f,i)=>'<button type="button" data-i="'+i+'">'+(vid?'<div class="vf">فيديو</div>':'<img loading="lazy" src="'+esc(f.download_url||f.name)+'" alt="">')+'<span>'+esc(f.name)+'</span></button>').join('');
      L.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;const f=list[+b.dataset.i];if(f.download_url)cache[f.name]=f.download_url;done(f.name)};
    }catch(e){L.className='msg err';L.textContent=ghErr(e)}
  });
}

/* ---------- admin ---------- */
async function adminLogin(){

/* ---------- import backup ---------- */
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('تعذّر تحميل قارئ Excel. استخدم CSV أو JSON.'));document.head.appendChild(s)})}
function parseCSV(t){const first=t.split(/\r?\n/)[0]||'';const d=[',',';','\t'].map(x=>[x,first.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);const h=rows.shift()||[];return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k.trim(),x[i]==null?'':x[i]])))}
async function readRows(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.json')){const j=JSON.parse(await f.text());return Array.isArray(j)?j:(j.products||j.items||j.data||[])}
  if(n.endsWith('.csv')||n.endsWith('.txt')||n.endsWith('.tsv')){const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1256').decode(buf)}return parseCSV(t.replace(/^﻿/,''))}
  await loadXlsx();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
}
const AL={
 oldPrice:['سعرقبلالخصم','السعرالقديم','oldprice','compareprice','سعرقديم'],
 code:['كود','كودالقطعة','الكود','كودالصنف','code','sku','barcode','باركود','رقمالصنف','itemcode','productcode'],
 name:['اسم','اسمالقطعة','الاسم','الصنف','اسمالصنف','name','item','itemname','product','productname','البيان'],
 price:['سعر','سعرالبيع','سعرالقطعة','price','saleprice','sellingprice','سعرالجمهور','sellprice','unitprice'],
 sizes:['مقاس','مقاسات','المقاسات','المقاس','size','sizes'],
 cat:['قسم','القسم','category','التصنيف','المجموعة','group']
};
const nk=s=>String(s).toLowerCase().replace(/[\s_\-:.]+/g,'');
function mapRows(rows,defCat){
  if(!rows.length)return[];const keys=Object.keys(rows[0]);const map={},used=new Set();
  for(const f of ['oldPrice','code','name','price','sizes','cat']){
    let k=keys.find(x=>!used.has(x)&&AL[f].includes(nk(x)));
    if(!k)k=keys.find(x=>!used.has(x)&&AL[f].some(a=>a.length>=3&&nk(x).includes(a)));
    if(k){map[f]=k;used.add(k)}
  }
  const catOf=v=>{const s=String(v||'');if(/نساء|حريمي|women|ladies|female/i.test(s))return 'women';if(/اطفال|أطفال|kids|child|baby/i.test(s))return 'kids';if(/رجال|men|male/i.test(s))return 'men';if(/مفروش|home|bed|بياضات/i.test(s))return 'home';return ''};
  return {map,items:rows.map(r=>({name:String(r[map.name]==null?'':r[map.name]).trim(),code:String(r[map.code]==null?'':r[map.code]).trim(),price:num(r[map.price]),oldPrice:map.oldPrice?num(r[map.oldPrice]):0,sizes:map.sizes?sizesToArr(r[map.sizes]):null,cat:catOf(r[map.cat])||defCat})).filter(x=>x.name)};
}
function tImport(p){
  let items=[];
  p.innerHTML=dirtyNote()+'<div class="box"><h3>استيراد نسخة احتياطية</h3><div class="hint">ارفع ملف Excel أو CSV أو JSON من برنامج المبيعات. يتم التعرّف تلقائياً على أعمدة اسم القطعة والكود وسعر البيع والمقاسات (والقسم إن وُجد).</div><label class="fld">القسم الافتراضي للقطع بدون قسم<select id="ic">'+CATS.filter(c=>c.id!=='offers').map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select></label><label class="fld">طريقة الاستيراد<select id="im"><option value="merge">دمج: تحديث القطع بنفس الكود وإضافة الجديد</option><option value="replace">استبدال كل القطع الحالية</option></select></label><label class="btn dark" style="cursor:pointer">اختيار الملف<input id="if" type="file" accept=".xlsx,.xls,.csv,.json,.txt,.tsv" hidden></label><div id="ir"></div></div>';
  $('#if').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=$('#ir');r.innerHTML='<div class="msg">جاري القراءة...</div>';

      r.innerHTML='<div class="msg">تم العثور على '+items.length+' قطعة.\nالأعمدة المعتمدة: '+Object.keys(m.map).map(k=>lab[k]+' ← '+m.map[k]).join(' ، ')+'</div>'+items.slice(0,5).map(x=>'<div class="li" style="grid-template-columns:1fr"><div><b>'+esc(x.name)+'</b><small>'+esc(x.code||'-')+' • '+money(x.price)+' • '+(x.sizes&&x.sizes.length?esc(x.sizes.join(' ')):'بدون مقاسات')+'</small></div></div>').join('')+'<button class="btn add" id="idoit">تأكيد الاستيراد</button>';
      $('#idoit').onclick=()=>{
        const by=new Map(D.products.filter(x=>x.code).map(x=>[x.code.toLowerCase(),x]));let add=0,upd=0;const out=[];
        for(const it of items){const ex=it.code&&by.get(it.code.toLowerCase());

        if($('#im').value==='replace')D.products=out;else{const ids=new Set(D.products.map(x=>x.id));D.products=out.filter(x=>!ids.has(x.id)).concat(D.products)}
        persist();renderAll();$('#ir').innerHTML='<div class="msg">تم الاستيراد: '+add+' قطعة جديدة و'+upd+' محدّثة. اضغط «تحديث البيانات» في تبويب GitHub لنشرها.</div>'};
    }catch(er){r.innerHTML='<div class="msg err">'+esc(er.message||'تعذّرت قراءة الملف')+'</div>'}};
}

  '<div class="box"><h3>تغيير كلمة المرور</h3><label class="fld">كلمة المرور الحالية<input id="p0" type="password" inputmode="numeric" autocomplete="current-password"></label><label class="fld">كلمة المرور الجديدة<input id="p1" type="password" autocomplete="new-password"></label><label class="fld">تأكيد الجديدة<input id="p2" type="password" autocomplete="new-password"></label><div class="msg" id="pm" hidden></div><button class="btn dark" id="psave">تغيير كلمة المرور</button></div>';
  $('#sv').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#svs').textContent='جاري الرفع...';try{const n=await uploadVideo(f);$('#su').value=n;$('#svs').textContent='تم الرفع: '+n}catch(er){$('#svs').textContent=ghErr(er)}};
  $('#svk').onclick=async()=>{const n=await pickRepo('video');if(n){$('#su').value=n;$('#svs').textContent='الفيديو: '+n+'. اضغط حفظ.'}};
  $('#svd').onclick=()=>{$('#su').value='';$('#svs').textContent='تم الحذف. اضغط حفظ.'};
  $('#ssv').onclick=()=>{D.settings.wa=$('#sw').value.replace(/\D/g,'');D.settings.ribbon=$('#sr').value.trim();D.settings.cur=$('#sc').value.trim()||'ج.م';D.settings.introVideo=$('#su').value.trim();persist();renderAll();toast('تم حفظ الإعدادات')};
  $('#sin').onclick=()=>{sess.set('roya_intro','');$('#sheet').classList.remove('on');runIntro()};
  $('#psave').onclick=async()=>{const m=$('#pm');m.hidden=false;m.classList.remove('err');
    if(await sha($('#p0').value.trim())!==D.pw){m.classList.add('err');m.textContent='كلمة المرور الحالية غير صحيحة';return}
    const n=$('#p1').value.trim();if(n.length<4){m.classList.add('err');m.textContent='كلمة المرور الجديدة قصيرة (4 أحرف على الأقل)';return}
    if(n!==$('#p2').value.trim()){m.classList.add('err');m.textContent='التأكيد لا يطابق كلمة المرور الجديدة';return}
    D.pw=await sha(n);persist();m.textContent='تم تغيير كلمة المرور. انشرها على GitHub لتسري على كل الأجهزة.';['p0','p1','p2'].forEach(i=>$('#'+i).value='')};
}

/* ---------- GitHub ---------- */
const ghCfg=()=>store.get('roya_gh',{});
const ghReady=()=>{const c=ghCfg();return !!(c.owner&&c.repo&&c.token)};
function ghErr(e){return (e instanceof TypeError)?'تعذّر الاتصال بـ GitHub. الاتصال يعمل بعد نشر الموقع على GitHub Pages (أو أي استضافة)، وليس من داخل معاينة Claude.':(e&&e.message)||'حدث خطأ'}
async function gh(method,path,body){const c=ghCfg();const r=await fetch('https://api.github.com/repos/'+c.owner+'/'+c.repo+'/'+path,{method,headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});if(!r.ok&&r.status!==404){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('GitHub '+r.status+(m?': '+m:''))}return r}
async function ghPut(path,b64,msg){const c=ghCfg(),br=c.branch||'main';let sha;const g=await gh('GET','contents/'+path+'?ref='+encodeURIComponent(br));if(g.ok)sha=(await g.json()).sha;const r=await gh('PUT','contents/'+path,{message:msg,content:b64,branch:br,sha});if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('فشل الرفع '+r.status+(m?': '+m:''))}return r}
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
const txtB64=t=>btoa(unescape(encodeURIComponent(t)));
function compress(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*k),h=Math.round(img.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};img.onerror=()=>rej(new Error('تعذّر قراءة الصورة'));img.src=u})}
async function uploadImage(file,max){const d=await compress(file,max);if(!ghReady())return d;const n=uid()+'.jpg';await ghPut(n,d.split(',')[1],'رفع صورة من واجهة المتجر');cache[n]=d;return n}
async function uploadVideo(file){if(!ghReady())throw new Error('رفع الفيديو يحتاج ربط GitHub من تبويب GitHub، أو ضع رابط الفيديو.');if(file.size>40*1024*1024)throw new Error('حجم الفيديو أكبر من 40MB. صغّره أولاً.');const ext=((file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,''))||'mp4';const n=uid()+'.'+ext;await ghPut(n,await fileB64(file),'رفع فيديو من واجهة المتجر');cache[n]=URL.createObjectURL(file);return n}
function exportData(){return {v:1,updatedAt:D.updatedAt,pw:D.pw,settings:D.settings,ads:D.ads,products:D.products}}
function dataOk(j){return j&&Array.isArray(j.products)&&Array.isArray(j.ads)&&j.settings&&j.pw}
function tGithub(p){
  const c=ghCfg();
  p.innerHTML=dirtyNote()+'<div class="box"><h3>ربط GitHub</h3><div class="hint">أنشئ Fine-grained token لهذا المستودع فقط بصلاحية Contents: Read and write. يُحفظ داخل متصفحك أنت فقط ولا يُنشر مع البيانات.</div>'+
  '<div class="row2"><label class="fld" style="flex:1">اسم الحساب<input id="go" dir="ltr" value="'+esc(c.owner||'')+'"></label><label class="fld" style="flex:1">اسم المستودع<input id="gr" dir="ltr" value="'+esc(c.repo||'')+'"></label></div>'+
  '<div class="row2"><label class="fld" style="flex:1">الفرع<input id="gb" dir="ltr" value="'+esc(c.branch||'main')+'"></label></div>'+
  '<label class="fld">Token<input id="gt" type="password" dir="ltr" autocomplete="off" value="'+esc(c.token||'')+'"></label><div class="row2"><button class="btn dark" id="gs" style="flex:1">حفظ واختبار الاتصال</button><button class="btn" id="gx">فصل</button></div></div>'+
  '<div class="box"><h3>مزامنة البيانات</h3><div class="hint">«تحديث البيانات» ينشر القطع والإعلانات والإعدادات في ملف data.json داخل المستودع ليراها كل الزوار. الصور والفيديوهات تضعها أنت في المستودع مباشرة بدون مجلدات، ثم تختارها من داخل نموذج القطعة أو الإعلان.</div><button class="btn add" id="gp">تحديث البيانات على GitHub</button><button class="btn" id="gl">جلب البيانات من GitHub</button><button class="btn sm" id="ge">تصدير نسخة JSON</button></div><div class="msg" id="gm" hidden></div>';
  const say=(t,err)=>{const m=$('#gm');m.hidden=false;m.classList.toggle('err',!!err);m.textContent=t};
  const rd=()=>store.set('roya_gh',{owner:$('#go').value.trim(),repo:$('#gr').value.trim().replace(/\.git$/,''),branch:$('#gb').value.trim()||'main',token:$('#gt').value.trim()});
  $('#gs').onclick=async()=>{rd();say('جاري الاختبار...');try{const r=await gh('GET','');if(r.status===404)throw new Error('المستودع غير موجود أو الـ token لا يملك صلاحية عليه');const j=await r.json();say('تم الاتصال بالمستودع '+j.full_name+(j.permissions&&!j.permissions.push?'\nتنبيه: الـ token بدون صلاحية كتابة.':''))}catch(e){say(ghErr(e),1)}};
  $('#gx').onclick=()=>{store.del('roya_gh');renderAdmin()};
  $('#gp').onclick=async()=>{rd();if(!ghReady()){say('أدخل اسم الحساب والمستودع والـ token أولاً',1);return}say('جاري الرفع...');try{D.updatedAt=Date.now();store.set('roya_data',D);await ghPut('data.json',txtB64(JSON.stringify(exportData(),null,1)),'تحديث بيانات المتجر من لوحة الإدارة');store.del('roya_dirty');say('تم تحديث data.json على GitHub. قد يستغرق ظهور التغيير للزوار دقيقة أو اثنتين على GitHub Pages.')}catch(e){say(ghErr(e),1)}};
  $('#gl').onclick=async()=>{rd();if(!ghReady()){say('أدخل بيانات الربط أولاً',1);return}say('جاري الجلب...');try{const r=await gh('GET','contents/data.json?ref='+encodeURIComponent(ghCfg().branch||'main'));if(r.status===404){say('لا يوجد data.json في المستودع بعد.',1);return}const j=await r.json();const d=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));if(!dataOk(d))throw new Error('ملف data.json غير صالح');D=Object.assign(DEF(),d);store.set('roya_data',D);store.del('roya_dirty');renderAll();say('تم جلب البيانات: '+D.products.length+' قطعة و'+D.ads.length+' إعلان.')}catch(e){say(ghErr(e),1)}};
  $('#ge').onclick=()=>{try{const b=new Blob([JSON.stringify(exportData(),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='roya-data.json';a.click();say('بدأ تنزيل roya-data.json')}catch(e){say('التنزيل غير متاح هنا',1)}};
}

/* ---------- boot ---------- */
(async function boot(){
  D=store.get('roya_data',null);
  if(!D||!dataOk(D)){D=DEF();D.pw=await sha('522853');persist();store.del('roya_dirty')}
  D.settings=Object.assign(DEF().settings,D.settings);
  if(sess.get('roya_admin')==='1')S.admin=true;
  renderAll();runIntro();
  if(!store.get('roya_dirty',0)){
    try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const d=await r.json();if(dataOk(d)&&d.updatedAt!==D.updatedAt){D=Object.assign(DEF(),d);store.set('roya_data',D);renderAll()}}}catch(e){}
  }
})();
})();
</script>
